services:
  abap-mcp-readonly:
    image: ${ABAP_MCP_IMAGE:?Set ABAP_MCP_IMAGE to a verified pinned server image tag or digest}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./systems.json:/app/config/systems.json:ro
    environment:
      SAP_SYSTEMS_FILE: /app/config/systems.json
      MCP_READ_ONLY: "1"
      MCP_TOOLSETS: source,objects,data
      MCP_MAX_RESPONSE_CHARS: "12000"
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_TOKEN: ${ABAP_MCP_TOKEN:?Set ABAP_MCP_TOKEN}
      ABAP_SAP_URL: ${ABAP_SAP_URL:?Set ABAP_SAP_URL}
      ABAP_SAP_CLIENT: ${ABAP_SAP_CLIENT:?Set ABAP_SAP_CLIENT}
      ABAP_SAP_USER: ${ABAP_SAP_USER:?Set ABAP_SAP_USER}
      ABAP_SAP_PASSWORD: ${ABAP_SAP_PASSWORD:?Set ABAP_SAP_PASSWORD}
    restart: unless-stopped
